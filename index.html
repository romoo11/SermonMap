function looksGarbled(text) {
  if (!text) return true;
  const total = text.replace(/\s/g, "").length;
  if (total < 40) return true;
  const ko = (text.match(/[가-힣]/g) || []).length;
  return ko / total < 0.1;
}

function guessService(fileName, text) {
  const src = (fileName || "") + " " + (text || "").slice(0, 400);

  if (/수요/.test(src)) return "수요 예배";
  if (/금요/.test(src)) return "금요 예배";
  if (/새벽/.test(src)) return "새벽 예배";

/* 설교 본문에서 핵심 문장을 골라 요약을 만듭니다 (AI 없이 작동) */
function makeSummary(rec) {
  let t = String(rec.content || "");
  if (t.length < 300) return "";
  /* 성경 구절 블록·머리말 제거 */
  t = t.replace(/^[\s\S]{0,1200}?(서\s*론|들어가는\s*말)/, "$1");
  t = t.replace(/\[\d+\]/g, " ").replace(/^\s*\d+\s+/gm, " ");
  t = t.replace(/[ \t]+/g, " ");

  /* 문장 나누기 */
  const raw = t.split(/(?<=[.!?])\s+|\n+/).map((s) => s.trim())
    .filter((s) => s.length >= 25 && s.length <= 220);
  if (raw.length < 4) return "";

  /* 구간 표시(서론·본론·결론) 위치 */
  const findIdx = (re) => raw.findIndex((s) => re.test(s));
  const iIntro = 0;
  const iBody = Math.max(findIdx(/본\s*론/), Math.floor(raw.length * 0.25));
  const iEnd = Math.max(findIdx(/결\s*론/), Math.floor(raw.length * 0.72));

  /* 신앙 핵심어가 많은 문장에 점수 */
  const KEY = ["하나님","주님","예수","말씀","믿음","은혜","기도","사랑","순종","구원",
    "성령","회개","축복","소망","십자가","감사","성도","우리","삶","마음"];
  const HINT = ["바랍니다","원합니다","되시기","됩니다","것입니다","해야 합니다","하시기 바랍니다"];
  const score = (s) => {
    let n = 0;
    KEY.forEach((k) => { if (s.includes(k)) n += 2; });
    HINT.forEach((k) => { if (s.includes(k)) n += 3; });
    if (/^(오늘|우리|그러므로|사랑하는)/.test(s)) n += 2;
    if (s.length > 140) n -= 2;
    return n;
  };
  const best = (from, to) => {
    const seg = raw.slice(Math.max(0, from), Math.min(raw.length, to));
    if (!seg.length) return null;
    return seg.map((s) => [s, score(s)]).sort((a, b) => b[1] - a[1])[0][0];
  };

  const picks = [
    best(iIntro, Math.max(3, Math.floor(raw.length * 0.18))),
    best(iBody, iBody + Math.floor(raw.length * 0.2)),
    best(Math.floor(raw.length * 0.45), Math.floor(raw.length * 0.68)),
    best(iEnd, raw.length),
  ].filter(Boolean);

  const seen = new Set();
  const out = [];
  picks.forEach((s) => {
    const k = s.slice(0, 18);
    if (seen.has(k)) return;
    seen.add(k);
    let c = s.replace(/^(서\s*론|본\s*론\s*\d*\.?|결\s*론)\s*[.:]?\s*/, "").trim();
    c = c.replace(/^["'“”‘’\s]+/, "");
    if (c && !/[.!?]$/.test(c)) c += ".";
    if (c.length > 20) out.push(c);
  });
  return out.slice(0, 4).join(" ");
}

/* 제목·요약·내용을 읽어 주제어 3~4개를 골라냅니다 */
function guessTopics(rec) {
  const head = ((rec.title || "") + " " + (rec.summary || "")).toLowerCase();
  const body = (rec.content || "").slice(0, 4000).toLowerCase();
  const scores = [];
  TOPIC_HINTS.forEach(([topic, words]) => {
    let n = 0;
    words.forEach((w) => {
      const k = w.toLowerCase();
      if (head.includes(k)) n += 6;
      let idx = body.indexOf(k), hit = 0;
      while (idx !== -1 && hit < 12) { hit++; idx = body.indexOf(k, idx + k.length); }
      n += hit;
    });
    if (n > 0) scores.push([topic, n]);
  });
  scores.sort((a, b) => b[1] - a[1]);
  return scores.slice(0, 4).filter((x) => x[1] >= 3).map((x) => x[0]);
}

const TAG_MAP = (() => {
  const m = {};
  TAG_MERGE.forEach(([main, list]) => list.forEach((w) => { m[w] = main; }));
  return m;
})();

/* 태그 하나를 대표 주제로 바꿉니다. 인물이면 null */
function normTag(t) {
  const s = String(t || "").trim();
  if (!s) return null;
  if (PERSON_TAGS.has(s)) return null;
  if (TAG_MAP[s]) return TAG_MAP[s];
  /* 포함 관계로 묶기: '복음의능력' → '복음' */
  for (const [main] of TAG_MERGE) {
    if (s !== main && (s.startsWith(main) || s.endsWith(main))) return main;
  }
  return s;
}

function categorizeTags(tagList) {
  /* tagList: [[tag, count], ...] → 가나다순 대분류 트리 */
  const groups = new Map();
  const misc = [];
  for (const [t, c] of tagList) {
    let placed = false;
    /* 대분류 이름과 정확히 같으면 그 분류로 */
    for (const cat of TOPIC_CATEGORIES) {
      if (t === cat.name) { placed = true; if (!groups.has(cat.name)) groups.set(cat.name, []); groups.get(cat.name).push({ t, c }); break; }
    }
    if (!placed) {
      for (const cat of TOPIC_CATEGORIES) {
        if (cat.keys.some((k) => t.includes(k) || (k.length >= 2 && k.includes(t)))) {
          placed = true;
          if (!groups.has(cat.name)) groups.set(cat.name, []);
          groups.get(cat.name).push({ t, c });
          break;
        }
      }
    }
    if (!placed) misc.push({ t, c });
  }
  const result = [...groups.entries()]
    .map(([name, tags]) => ({
      name,
      tags: tags.sort((a, b) => a.t.localeCompare(b.t, "ko")),
      count: tags.reduce((s, x) => s + x.c, 0),
    }))
    .sort((a, b) => a.name.localeCompare(b.name, "ko"));
  if (misc.length) {
    result.push({
      name: "기타",
      tags: misc.sort((a, b) => a.t.localeCompare(b.t, "ko")),
      count: misc.reduce((s, x) => s + x.c, 0),
    });
  }
  return result;
}

/* ── ZIP 해제 (HWPX용, 브라우저 내장 압축 해제 사용) ───── */
async function unzip(buf) {
  const view = new DataView(buf);
  const bytes = new Uint8Array(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65558); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("zip format");
  const count = view.getUint16(eocd + 10, true);
  let off = view.getUint32(eocd + 16, true);
  const files = {};
  for (let n = 0; n < count; n++) {
    if (view.getUint32(off, true) !== 0x02014b50) break;
    const method = view.getUint16(off + 10, true);
    const csize = view.getUint32(off + 20, true);
    const nameLen = view.getUint16(off + 28, true);
    const extraLen = view.getUint16(off + 30, true);
    const commentLen = view.getUint16(off + 32, true);
    const localOff = view.getUint32(off + 42, true);
    const name = new TextDecoder().decode(bytes.slice(off + 46, off + 46 + nameLen));
    files[name] = { method, csize, localOff };
    off += 46 + nameLen + extraLen + commentLen;
  }
  const read = async (name) => {
    const f = files[name];
    if (!f) return null;
    const lo = f.localOff;
    const nLen = view.getUint16(lo + 26, true);
    const eLen = view.getUint16(lo + 28, true);
    const start = lo + 30 + nLen + eLen;
    const data = bytes.slice(start, start + f.csize);
    if (f.method === 0) return data;
    const ds = new DecompressionStream("deflate-raw");
    const stream = new Blob([data]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  };
  return { names: Object.keys(files), read };
}

/* ── HWPX 본문 추출 ── */
function loadFflate() {
  return new Promise((resolve, reject) => {
    if (window.fflate) return resolve(window.fflate);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/fflate/0.8.2/index.min.js";
    s.onload = () => resolve(window.fflate);
    s.onerror = () => reject(new Error("압축 해제 모듈을 불러오지 못했습니다"));
    document.head.appendChild(s);
  });
}

async function extractHwpx(buf) {
  /* 1) fflate로 압축 해제, 실패 시 자체 해제로 폴백 */
  let entries = [];
  try {
    const fflate = await loadFflate();
    const unzipped = fflate.unzipSync(new Uint8Array(buf));
    entries = Object.keys(unzipped).map((n) => ({ name: n, read: async () => unzipped[n] }));
  } catch (e) {
    const zip = await unzip(buf);
    entries = zip.names.map((n) => ({ name: n, read: () => zip.read(n) }));
  }
  if (!entries.length) throw new Error("압축을 풀지 못했습니다");

  /* 2) 본문 XML 찾기 (표준 위치 → 넓은 탐색 순) */
  let sections = entries.filter((e) => /^Contents\/section\d+\.xml$/i.test(e.name));
  if (!sections.length) sections = entries.filter((e) => /section\d+\.xml$/i.test(e.name));
  if (!sections.length) sections = entries.filter((e) => /^Contents\/.+\.xml$/i.test(e.name));
  if (!sections.length) throw new Error("본문 XML을 찾지 못했습니다 (HWPX 형식이 맞는지 확인해 주세요)");
  sections.sort((a, b) => a.name.localeCompare(b.name));

  /* 3) 문단(p) 안의 글자(t) 추출 */
  const parts = [];
  for (const s of sections) {
    const data = await s.read();
    const xml = new TextDecoder("utf-8").decode(data);
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    const all = doc.getElementsByTagName("*");
    const lines = [];
    for (let i = 0; i < all.length; i++) {
      if (all[i].localName === "p") {
        let t = "";
        const inner = all[i].getElementsByTagName("*");
        for (let j = 0; j < inner.length; j++) {
          if (inner[j].localName === "t") t += inner[j].textContent;
        }
        if (t.trim()) lines.push(t.trim());
      }
    }
    if (!lines.length) {
      for (let i = 0; i < all.length; i++) {
        if (all[i].localName === "t" && all[i].textContent.trim()) lines.push(all[i].textContent.trim());
      }
    }
    if (lines.length) parts.push(lines.join("\n"));
  }
  const text = parts.join("\n\n").trim();
  if (!text) throw new Error("파일에서 글자를 찾지 못했습니다");
  return text;
}

/* ── PDF 본문 추출 (pdf.js 동적 로드) ── */
function loadPdfJs() {
  return new Promise((resolve, reject) => {
    if (window.pdfjsLib) return resolve(window.pdfjsLib);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      resolve(window.pdfjsLib);
    };
    s.onerror = () => reject(new Error("pdf.js load"));
    document.head.appendChild(s);
  });
}

async function extractPdf(buf) {
  const pdfjs = await loadPdfJs();
  const doc = await pdfjs.getDocument({
    data: new Uint8Array(buf),
    disableFontFace: true,
    isEvalSupported: false,
  }).promise;
  const parts = [];
  for (let p = 1; p <= doc.numPages; p++) {
    try {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      parts.push(tc.items.map((i) => i.str).join(" "));
    } catch (e) {
      /* 일부 페이지 실패는 건너뜀 */
    }
  }
  return parts.join("\n\n").trim();
}

/* ── 형식별 파일 읽기 (일괄 등록용) ── */
async function readFileText(file) {
  const lower = file.name.toLowerCase();
  if (lower.endsWith(".docx")) {
    const buf = await file.arrayBuffer();
    const r = await mammoth.extractRawText({ arrayBuffer: buf });
    return (r.value || "").trim();
  }
  if (lower.endsWith(".txt")) return (await file.text()).trim();
  if (lower.endsWith(".hwpx")) {
    const buf = await file.arrayBuffer();
    return await extractHwpx(buf);
  }
  if (lower.endsWith(".pdf")) {
    const buf = await file.arrayBuffer();
    return await extractPdf(buf);
  }
  if (lower.endsWith(".hwp")) throw new Error("HWP_UNSUPPORTED");
  throw new Error("FORMAT_UNSUPPORTED");
}

function normalizeBook(raw) {
  if (!raw) return "";
  const s = String(raw).replace(/\s/g, "").replace(/복음서$/, "복음");
  if (BOOK_NAMES.includes(s)) return s;
  if (BOOK_ALIASES[s]) return BOOK_ALIASES[s];
  for (const b of BOOK_NAMES) if (s.startsWith(b)) return b;
  return "";
}

/* ── AI 없이 본문 말씀 찾기 (문서 앞부분에서 '책이름 3:16' 패턴 탐색) ── */
function detectScripture(text) {
  const head = (text || "").slice(0, 1500);
  const names = [...BOOK_NAMES, ...Object.keys(BOOK_ALIASES)].sort((a, b) => b.length - a.length);
  for (const n of names) {
    let from = 0;
    while (true) {
      const idx = head.indexOf(n, from);
      if (idx < 0) break;
      const after = head.slice(idx + n.length, idx + n.length + 30);
      const m = after.match(/^\s*(\d{1,3})\s*[:장편]\s*(\d{1,3})(\s*[-~]\s*(\d{1,3}))?/);
      if (m) {
        const book = normalizeBook(n);
        if (book) return { book, ref: `${m[1]}:${m[2]}${m[4] ? "-" + m[4] : ""}` };
      }
      from = idx + 1;
    }
  }
  return null;
}

/* ── AI 분석 + 자동 재시도 (요청 몰림·일시 오류 대응) ── */
async function aiExtractRetry(text, tries = 3) {
  let lastErr = null;
  for (let a = 0; a < tries; a++) {
    try {
      return await aiExtract(text);
    } catch (e) {
      lastErr = e;
      const msg = (e && e.message) || "";
      const retriable = /429|529|500|overloaded|rate|응답 오류|비어/i.test(msg);
      if (a < tries - 1 && retriable) {
        await new Promise((r) => setTimeout(r, 4000 * (a + 1)));
        continue;
      }
      throw e;
    }
  }
  throw lastErr;
}

/* ── 파일명·본문에서 날짜 추출 (AI 없이 즉시) ── */
function guessDate(fileName, text) {
  const src = (fileName || "") + "\n" + (text || "").slice(0, 800);
  let m = src.match(/(20\d{2})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if (m) {
    const mo = +m[2], d = +m[3];
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31)
      return `${m[1]}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  }
  m = src.match(/(20\d{2})(\d{2})(\d{2})/);
  if (m) {
    const mo = +m[2], d = +m[3];
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return `${m[1]}-${m[2]}-${m[3]}`;
  }
  return "";
}

/* ── AI 분석 (설교문 → 메타데이터 JSON) ── */
async function aiExtract(text) {
  const prompt = `다음은 설교문입니다. 내용을 분석해 아래 형식의 JSON 객체만 출력하세요. 마크다운 코드 블록이나 다른 설명 없이 JSON만 출력합니다.

  "tags": ["핵심 주제 태그 3~5개, 각각 2~6자"],
  "summary": "설교의 핵심 메시지 3~4문장 요약"
}

설교문:
${text}`;
  let key = "";
  try { key = localStorage.getItem(API_KEY_STORAGE) || ""; } catch (e) {}
  if (!key) throw new Error("AI 분석을 쓰려면 API 키를 등록해 주세요 (새 설교 화면 아래)");
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  let data = null;
  try { data = await response.json(); } catch (e) { /* 비정상 응답 */ }
  if (!response.ok || (data && data.error)) {
    const msg = data && data.error && data.error.message
      ? data.error.message
      : "응답 오류 (" + response.status + ")";
    throw new Error(msg);
  }
  if (!data || !Array.isArray(data.content)) throw new Error("응답이 비어 있습니다");
  const raw = data.content.map((i) => (i && i.text) || "").join("\n");
  const a = raw.indexOf("{");
  const b = raw.lastIndexOf("}");
  if (a < 0 || b <= a) throw new Error("분석 결과 형식 오류");
  return JSON.parse(raw.slice(a, b + 1));
}

/* ── 커버리지 색 (설교 횟수 → 잉크 농도) ───────────────── */
function heat(count, max) {
  if (!count) return "var(--cell-empty)";
  const t = Math.min(1, count / Math.max(1, max));
  const light = 82 - t * 50; // 82% → 32%
  return `hsl(215, 46%, ${light}%)`;
}

/* ── 초성 판별 및 초성별 교차 색상 (보라 ↔ 빨강) ───────── */
const CHO = ["ㄱ","ㄱ","ㄴ","ㄷ","ㄷ","ㄹ","ㅁ","ㅂ","ㅂ","ㅅ","ㅅ","ㅇ","ㅈ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function choseong(str) {
  if (!str) return "";
  const c = str.charCodeAt(0) - 0xac00;
  if (c < 0 || c > 11171) return str[0];
  return CHO[Math.floor(c / 588)];
}
const HUE_GREEN = 163; /* 에메랄드 녹색 */
const HUE_BLUE = 224;  /* 파랑 */
function heatHue(count, max, hue) {
  if (!count) return "var(--cell-empty)";
  const t = Math.min(1, count / Math.max(1, max));
  const light = 84 - t * 46; // 84% → 38%
  return `hsl(${hue}, ${hue === HUE_GREEN ? 60 : 52}%, ${light}%)`;
}
/* 가나다순 이름 목록 → 초성이 바뀔 때마다 에메랄드/파랑 교차 배정 */
function alternateHues(names) {
  const hues = [];
  let idx = 0;
  let prev = null;
  for (const n of names) {
    const c = choseong(n);
    if (prev !== null && c !== prev) idx = 1 - idx;
    hues.push(idx === 0 ? HUE_GREEN : HUE_BLUE);
    prev = c;
  }
  return hues;
}

    setBusy(false);
    if (error) setErr(error.message === "Invalid login credentials" ? "이메일 또는 비밀번호가 올바르지 않습니다." : "로그인 실패: " + error.message);
  };
  const doSignup = async () => {
    setErr(""); setInfo("");
    if (!email.trim().includes("@")) { setErr("올바른 이메일을 입력해 주세요."); return; }
    if (name.trim().length < 2) { setErr("이름(표시명)은 2자 이상으로 정해주세요."); return; }
    if (pw.length < 6) { setErr("비밀번호는 6자 이상으로 정해주세요."); return; }
    if (pw !== pw2) { setErr("비밀번호 확인이 일치하지 않습니다."); return; }
    setBusy(true);
    const { data, error } = await sb.auth.signUp({
      email: email.trim(), password: pw,
      options: { data: { display_name: name.trim() } },
    });
    setBusy(false);
    if (error) { setErr("가입 실패: " + error.message); return; }
    if (data && !data.session) setInfo("확인 이메일을 보냈습니다. 메일함에서 링크를 눌러 가입을 완료한 뒤 로그인해 주세요.");
  };
  const doReset = async () => {
    setErr(""); setInfo("");
    if (!email.trim().includes("@")) { setErr("가입한 이메일을 입력해 주세요."); return; }
    setBusy(true);
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.href.split("#")[0] });
    setBusy(false);
    if (error) setErr("메일 발송 실패: " + error.message);
    else setInfo("비밀번호 재설정 메일을 보냈습니다. 메일의 링크를 눌러 이 페이지로 돌아오면 새 비밀번호를 정할 수 있습니다.");
  };
  const submit = (e) => {
    if (e.key !== "Enter") return;
    if (mode === "login") doLogin(); else if (mode === "signup") doSignup(); else doReset();
  };

  return (
    <div className="app">
      <style>{CSS}</style>
      <div className="auth-wrap">
        <div className="auth-card">
          <div className="auth-brand">
            <img className="auth-logo" src={ICON_IMG} alt="" />
            <h1>설교이음</h1>
            <p>말씀의 기록과 흐름을 한 곳에</p>
          </div>
          <div className="auth-tabs">
            <button className={mode === "login" ? "on" : ""} onClick={() => { setMode("login"); setErr(""); setInfo(""); }}>로그인</button>
            <button className={mode === "signup" ? "on" : ""} onClick={() => { setMode("signup"); setErr(""); setInfo(""); }}>계정 만들기</button>
          </div>
          <label className="field"><span>이메일</span>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={submit} autoFocus />
          </label>
          {mode === "signup" && (
            <label className="field"><span>이름 (공동 서재에 표시될 이름)</span>
              <input value={name} onChange={(e) => setName(e.target.value)} onKeyDown={submit} />
            </label>
          )}
          {mode !== "reset" && (
            <label className="field"><span>비밀번호</span>
              <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={submit} />
            </label>
          )}
          {mode === "signup" && (
            <label className="field"><span>비밀번호 확인</span>
              <input type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} onKeyDown={submit} />
            </label>
          )}
          {err && <p className="auth-err">{err}</p>}
          {info && <p className="auth-hint">{info}</p>}
          <button className="primary auth-submit" disabled={busy}
            onClick={mode === "login" ? doLogin : mode === "signup" ? doSignup : doReset}>
            {busy ? "처리 중…" : mode === "login" ? "로그인" : mode === "signup" ? "계정 만들기" : "재설정 메일 보내기"}
          </button>
          {mode === "login" && (
            <p className="auth-note">
              비밀번호를 잊으셨나요?{" "}
              <button className="batch-link" onClick={() => { setMode("reset"); setErr(""); setInfo(""); }}>비밀번호 재설정</button>
            </p>
          )}
          {mode === "reset" && (
            <p className="auth-note">
              <button className="batch-link" onClick={() => { setMode("login"); setErr(""); setInfo(""); }}>← 로그인으로 돌아가기</button>
            </p>
          )}
          <p className="auth-note">계정 하나로 컴퓨터·휴대폰 어디서나 같은 기록을 사용할 수 있습니다.</p>
        </div>
      </div>
    </div>
  );
}

function NewPasswordScreen({ onDone }) {
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const save = async () => {
    setErr("");
    if (pw.length < 6) { setErr("비밀번호는 6자 이상으로 정해주세요."); return; }
    if (pw !== pw2) { setErr("비밀번호 확인이 일치하지 않습니다."); return; }
    setBusy(true);
    const { error } = await sb.auth.updateUser({ password: pw });
    setBusy(false);
    if (error) { setErr("변경 실패: " + error.message); return; }
    onDone();
  };
  return (
    <div className="app">
      <style>{CSS}</style>
      <div className="auth-wrap">
        <div className="auth-card">
          <div className="auth-brand">
            <span className="brand-mark">≡</span>
            <h1>새 비밀번호 설정</h1>
          </div>
          <label className="field"><span>새 비밀번호</span>
            <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} autoFocus />
          </label>
          <label className="field"><span>새 비밀번호 확인</span>
            <input type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} />
          </label>
          {err && <p className="auth-err">{err}</p>}
          <button className="primary auth-submit" disabled={busy} onClick={save}>{busy ? "처리 중…" : "비밀번호 변경"}</button>
        </div>
      </div>
    </div>
  );
}

function Landing({ onEnter, userName, onLogout }) {
  const [stats, setStats] = useState(null);
  const [statErr, setStatErr] = useState("");
  const [isAdmin, setIsAdmin] = useState(false);
  const [openStats, setOpenStats] = useState(false);

  const [delTarget, setDelTarget] = useState(null);
  const [delMsg, setDelMsg] = useState("");

  const removeUser = async (row) => {
    setDelMsg("삭제 중…");
    try {
      const res = await sb.rpc("admin_delete_user", { target_email: row.email });
      if (res.error) { setDelMsg("삭제 실패 — " + (res.error.message || "")); return; }
      setDelMsg((row.name || row.email) + " 계정과 자료를 삭제했습니다.");
      setDelTarget(null);
      await loadStats();
    } catch (e) {
      setDelMsg("삭제 실패 — " + ((e && e.message) || "네트워크 오류"));
    }
  };

  const loadStats = async () => {
    setStats(null); setStatErr("");
    try {
      const res = await sb.rpc("admin_stats");
      if (res.error) { setStatErr(res.error.message || "알 수 없는 오류"); return; }
      setStats(res.data);
    } catch (e) { setStatErr((e && e.message) || "네트워크 오류"); }
  };

  useEffect(() => {
    if (!sb) return;
    (async () => {
      try {
        const { data } = await sb.auth.getSession();
        const email = data && data.session && data.session.user && data.session.user.email;
        if (!email) return;
        if (email.toLowerCase().trim() !== ADMIN_EMAIL.toLowerCase().trim()) return;
        setIsAdmin(true);
        await loadStats();
      } catch (e) { setStatErr((e && e.message) || "네트워크 오류"); }
    })();
  }, []);

  return (
    <div className="landing">
      <style>{CSS}</style>
      <div className="landing-scene" style={{ backgroundImage: "url(" + LANDING_BG + ")" }} />
      {onLogout && (
        <div className="gate-user">
          <span className="gate-user-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M3.8 21c0-4.6 3.7-7.3 8.2-7.3s8.2 2.7 8.2 7.3z"/></svg></span>
          <span className="gate-user-name">{userName || "내 계정"}</span>
          <span className="gate-user-bar" aria-hidden="true"></span>
          <button type="button" onClick={onLogout}>로그아웃</button>
        </div>
      )}
      <div className="landing-inner">
        <img className="landing-mark" src={ICON_IMG} alt="" />
        <p className="landing-eyebrow"><span>SERMON IEUM</span></p>
        <h1>설교이음</h1>
        <p className="landing-sub">내 설교를 한 눈에</p>
        <button className="enter-btn" onClick={onEnter}>
          들어가기<svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" strokeWidth="2.1" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
        {isAdmin && !openStats && (
          <p className="landing-admin"><button onClick={() => setOpenStats(true)}>🔒 관리자 현황</button></p>
        )}
      </div>
      {isAdmin && openStats && (
        <div className="admin-sheet">
          <div className="admin-card">
            <div className="admin-head">
              <h2>
                사용자 현황
                {stats && (
                  <small>

                  그보다 오래되면 <b>안 쓰는 듯</b>으로 봅니다. 설교를 한 편도 등록하지 않았으면 <b>시작 안 함</b>입니다.

}

function AuthGate() {
  const [entered, setEntered] = useState(false);
  const [session, setSession] = useState(undefined);
  const [recovery, setRecovery] = useState(false);
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((event, sess) => {
      setSession(sess || null);
      if (event === "PASSWORD_RECOVERY") setRecovery(true);
    });
    return () => sub.subscription.unsubscribe();
  }, []);
  if (!entered) return <Landing onEnter={() => setEntered(true)}
    userName={session ? ((session.user.user_metadata && session.user.user_metadata.display_name) || session.user.email) : ""}
    onLogout={session ? () => sb.auth.signOut() : null} />;
  if (!sb) return <SetupScreen />;
  if (session === undefined) {
    return (
      <div className="app"><style>{CSS}</style>
        <div className="auth-wrap"><p className="muted">불러오는 중…</p></div>
      </div>
    );
  }
  if (recovery && session) return <NewPasswordScreen onDone={() => setRecovery(false)} />;
  if (!session) return <LoginScreen />;
  const u = session.user;
  const profileName = (u.user_metadata && u.user_metadata.display_name) || u.email;
  return (
    <SermonArchive
      user={u}
      profileName={profileName}
      onHome={() => setEntered(false)}
      onLogout={() => sb.auth.signOut()}
    />
  );
}

function SermonArchive({ user, profileName, onHome, onLogout }) {
  const [sermons, setSermons] = useState([]);
  const [library, setLibrary] = useState("personal"); /* personal | shared */
  const [saveScope, setSaveScope] = useState("personal");
  const [batchScope, setBatchScope] = useState("personal");
  const [loaded, setLoaded] = useState(false);
  const scoped = useMemo(
    () => sermons.filter((s) => (s.scope || "personal") === library),
    [sermons, library]
  );
  const [saveState, setSaveState] = useState("idle"); // idle | saving | error
  const [saveErr, setSaveErr] = useState("");
  const [apiKey, setApiKey] = useState(() => {
    try { return localStorage.getItem(API_KEY_STORAGE) || ""; } catch (e) { return ""; }
  });
  const [keyInput, setKeyInput] = useState("");
  const saveKey = () => {
    const k = keyInput.trim();
    if (!k) return;
    try { localStorage.setItem(API_KEY_STORAGE, k); } catch (e) {}
    setApiKey(k);
    setKeyInput("");
  };
  const clearKey = () => {
    try { localStorage.removeItem(API_KEY_STORAGE); } catch (e) {}
    setApiKey("");
  };
  const [view, setView] = useState("list"); // list | form | map
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(EMPTY_FORM);
  const [query, setQuery] = useState("");
  const [searchScope, setSearchScope] = useState("all"); /* all | meta */
  const [fYear, setFYear] = useState("전체");
  const [fSeason, setFSeason] = useState("전체");
  const [fTag, setFTag] = useState("전체");
  const [fState, setFState] = useState("전체"); /* 전체 | 미분석 */
  const [fService, setFService] = useState("전체");
  const [openId, setOpenId] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [mapBook, setMapBook] = useState(null);
  const [mapOpenId, setMapOpenId] = useState(null);
  useEffect(() => {
    if (view === "list" && openId) {
      setTimeout(() => {
        const el = document.getElementById("card-" + openId);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 120);
    }
  }, [view, openId]);
  const [confirmDel, setConfirmDel] = useState(null);
  const [fileMsg, setFileMsg] = useState("");
  const [pendingFile, setPendingFile] = useState(null); /* 등록할 원본 파일 */
  const [editFilePath, setEditFilePath] = useState("");
  const [pdfView, setPdfView] = useState(null); /* {id, url} */

  const uploadOriginal = async (file) => {
    try {
      const ext = ((file.name || "").match(/\.[A-Za-z0-9]+$/) || [""])[0].toLowerCase();
      const path = user.id + "/" + uid() + ext;
      const { error } = await sb.storage.from("sermons").upload(path, file, { upsert: false });
      if (error) return "";
      return path;
    } catch (e) { return ""; }
  };
  const [analyzing, setAnalyzing] = useState(false);
  const [aiError, setAiError] = useState("");

  /* ── 파일 읽기 → 자동 분석까지 한 번에 ── */
  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setFileMsg("");
    setAiError("");
    const name = file.name;
    const lower = name.toLowerCase();
    e.target.value = "";
    try {
      if (lower.endsWith(".hwp")) {
        setPendingFile(file);
        setForm((f) => ({ ...f, fileName: f.fileName || name, date: f.date || guessDate(name, "") }));
        setFileMsg("일반 한글(.hwp) 파일은 브라우저에서 직접 읽을 수 없습니다. 한글 프로그램에서 '다른 이름으로 저장'으로 HWPX나 Word(.docx)로 저장한 뒤 올려주세요. 파일명과 날짜는 기록해 두었습니다.");
        return;
      }
      if (!/\.(docx|txt|hwpx|pdf)$/.test(lower)) {
        setFileMsg("지원하지 않는 형식입니다. 워드(.docx), 한글(.hwpx), PDF, 텍스트(.txt) 파일을 올려주세요.");
        return;
      }
      setPendingFile(file);
      setFileMsg("파일을 읽는 중…");
      let text = await readFileText(file);
      if (lower.endsWith(".pdf") && text && looksGarbled(text)) {
        setForm((f) => ({ ...f, fileName: f.fileName || name, date: f.date || guessDate(name, "") }));
        setFileMsg("이 PDF는 글자 정보가 손상되어 내용을 읽을 수 없습니다 (한글에서 만든 일부 PDF의 특성). 원본 한글(.hwp) 파일을 Claude 대화에 올려 변환받거나, 한글에서 PDF로 다시 저장해 보세요. 파일명과 날짜는 기록해 두었습니다.");
        return;
      }
      if (!text) {
        setForm((f) => ({ ...f, fileName: f.fileName || name, date: f.date || guessDate(name, "") }));
        setFileMsg("이 파일에서 글자를 찾지 못했습니다. 스캔본(이미지) PDF일 수 있으니 내용을 직접 붙여넣어 주세요.");
        return;
      }
      const det = detectScripture(text);
      setForm((f) => ({
        ...f,
        fileName: f.fileName || name,
        content: text,
        date: f.date || guessDate(name, text),
        book: f.book || (det ? det.book : ""),
        ref: f.ref.trim() ? f.ref : (det ? det.ref : ""),
        service: (f.service && f.service !== "미지정") ? f.service : guessService(name, text),
      }));
      setFileMsg("내용을 불러왔습니다. 이어서 자동 분석 중…");
      await runAnalysis(text);
    } catch (err) {
      setFileMsg(
        "파일을 읽는 중 오류가 발생했습니다" +
        (err && err.message && !/^[A-Z_]+$/.test(err.message) ? ` (${err.message})` : "") +
        ". 내용을 직접 붙여넣거나 워드(.docx)로 변환해 보세요."
      );
    }
  };

  /* ── AI 자동 분석 (단일) ── */
  const runAnalysis = async (text) => {
    if (!text || !text.trim() || analyzing) return;
    setAnalyzing(true);
    setAiError("");
    try {
      const p = await aiExtractRetry(text.slice(0, 9000));
      setForm((f) => ({
        ...f,
        title: f.title.trim() ? f.title : (p.title || ""),
        date: f.date || (p.date || ""),
        book: f.book || normalizeBook(p.book),
        ref: f.ref.trim() ? f.ref : (p.ref || ""),
        season: SEASONS.includes(p.season) ? p.season : f.season,
        service: (f.service && f.service !== "미지정") ? f.service
          : (SERVICE_TYPES.includes(p.service) ? p.service : f.service),
        tags: f.tags.trim() ? f.tags : (Array.isArray(p.tags) ? p.tags.join(", ") : ""),
        summary: p.summary || f.summary,
      }));
      setFileMsg("자동 분석이 끝났습니다. 채워진 내용을 확인하고 아래 '저장'을 눌러주세요.");
    } catch (err) {
      setAiError("자동 분석에 실패했습니다: " + (err && err.message ? err.message : "알 수 없는 오류") + " — 아래 'AI로 자동 분석' 버튼으로 다시 시도할 수 있습니다.");
    }
    setAnalyzing(false);
  };

  const analyze = () => runAnalysis(form.content);

  /* ── 일괄 등록 ── */
  const [batchItems, setBatchItems] = useState([]);
  const [batchRunning, setBatchRunning] = useState(false);
  const [batchUseAI, setBatchUseAI] = useState(true);
  const [batchDone, setBatchDone] = useState(false);

  const [batchSkipDup, setBatchSkipDup] = useState(true);
  const [linkItems, setLinkItems] = useState([]);
  const [linkRunning, setLinkRunning] = useState(false);

  /* 기존 기록에 원본 파일 붙이기 (파일명으로 짝 찾기) */
  const runLink = async (files) => {
    if (!files.length || linkRunning) return;
    setLinkRunning(true);
    setLinkItems(files.map((f) => ({ name: f.name, status: "대기", note: "" })));
    const upd = (i, status, note) =>
      setLinkItems((prev) => prev.map((it, j) => (j === i ? { ...it, status, note: note || it.note } : it)));
    const norm = (x) => {
      const s = x || "";
      return s.normalize ? s.normalize("NFC") : s;
    };
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const fname = norm(file.name);
      const fbase = fname.replace(/\.[^.]+$/, "");
      const matches = sermons.filter((s) => {
        if (s.mine === false) return false;
        const rn = norm(s.fileName);
        return rn === fname || rn.replace(/\.[^.]+$/, "") === fbase;
      });
      if (!matches.length) {
        upd(i, "실패", "일치하는 기록 없음 — 파일명이 기록의 '원본 파일'과 같아야 합니다");
        continue;
      }
      if (matches.every((m) => m.filePath)) {
        upd(i, "건너뜀", "이미 원본이 연결되어 있음");
        continue;
      }
      upd(i, "올리는 중");
      const fp = await uploadOriginal(file);
      if (!fp) { upd(i, "실패", "파일 업로드 실패"); continue; }
      let ok = 0;
      for (const m of matches) {
        if (m.filePath) continue;
        try {
          const { error } = await sb.from("sermons").update({ file_path: fp }).eq("id", m.id);
          if (!error) ok++;
        } catch (e) { /* 개별 실패 */ }
      }
      if (ok) {
        setSermons((prev) => prev.map((p) =>
          (!p.filePath && matches.some((m) => m.id === p.id)) ? { ...p, filePath: fp } : p));
        upd(i, "완료", ok > 1 ? ok + "개 기록에 연결됨" : "");
      } else {
        upd(i, "실패", "기록 갱신 실패");
      }
    }
    setLinkRunning(false);
  };

  const runBatch = async (files) => {
    if (!files.length || batchRunning) return;
    setBatchRunning(true);
    setBatchDone(false);
    setBatchItems(files.map((f) => ({ name: f.name, status: "대기", note: "" })));
    const seenNames = new Set();

    const upd = (i, status, note) =>
      setBatchItems((prev) => prev.map((it, j) => (j === i ? { ...it, status, note: note || it.note } : it)));

    const newRecords = [];
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      try {
        if (batchSkipDup) {
          const dupFile = seenNames.has(file.name) ||
            sermons.some((s) => (s.scope || "personal") === batchScope && s.fileName === file.name);
          if (dupFile) { upd(i, "건너뜀", "이미 등록된 파일(중복)"); continue; }
        }
        seenNames.add(file.name);
        upd(i, "읽는 중");
        let text = await readFileText(file);
        let garbled = false;
        if (file.name.toLowerCase().endsWith(".pdf") && text && looksGarbled(text)) {
          text = "";
          garbled = true;
        }
        const det = detectScripture(text || "");
        let rec = {
          id: uid(),
          title: file.name.replace(/\.[^.]+$/, ""),
          date: guessDate(file.name, text),
          book: det ? det.book : "",
          ref: det ? det.ref : "",
          season: "일반",
          service: guessService(file.name, text),
          tags: [], fileName: file.name, content: text || "", summary: "",
        };
        let note = "";
        if (batchUseAI && text) {
          upd(i, "AI 분석 중");
          try {
            const p = await aiExtractRetry(text.slice(0, 9000));
            rec = {
              ...rec,
              title: p.title || rec.title,
              date: p.date || rec.date,
              book: normalizeBook(p.book) || rec.book,
              ref: p.ref || rec.ref,
              season: SEASONS.includes(p.season) ? p.season : "일반",
              service: SERVICE_TYPES.includes(p.service) && p.service !== "미지정" ? p.service : rec.service,
              tags: Array.isArray(p.tags) ? p.tags : [],
              summary: p.summary || "",
            };
          } catch (e) {
            note = "분석 실패 — 내용만 저장됨";
          }
          if (i < files.length - 1) await new Promise((r) => setTimeout(r, 800));
        } else if (batchUseAI && !text) {
          note = garbled ? "글자 정보 손상 PDF — 파일명만 저장됨 (원본 hwp 변환 필요)" : "글자를 찾지 못해 파일명만 저장됨";
        }
        if (garbled && !note) note = "글자 정보 손상 PDF — 파일명만 저장됨 (원본 hwp 변환 필요)";
        if (!rec.summary) { const sm = makeSummary(rec); if (sm) rec.summary = sm; }
        if (!(rec.tags || []).length) { const tg = guessTopics(rec); if (tg.length) rec.tags = tg; }
        if (!note && !rec.book) note = "본문 말씀을 찾지 못함 — 수정에서 채워주세요";
        const fp = await uploadOriginal(file);
        if (fp) rec.filePath = fp;
        newRecords.push(rec);
        upd(i, "완료", note);
      } catch (e) {
        const msg =
          e.message === "HWP_UNSUPPORTED" ? "HWP는 HWPX/워드로 변환 후 올려주세요"
          : e.message === "FORMAT_UNSUPPORTED" ? "지원하지 않는 형식"
          : "파일 읽기 실패";
        upd(i, "실패", msg);
      }
    }
    if (newRecords.length) {
      await insertRecords(newRecords, batchScope);
    }
    setBatchRunning(false);
    setBatchDone(true);
  };

  /* ── 예화 ── */
  const [illus, setIllus] = useState([]);
  const [illQuery, setIllQuery] = useState("");
  const [illTag, setIllTag] = useState("전체");
  const [illOpenId, setIllOpenId] = useState(null);
  const [illSort, setIllSort] = useState("recent");
  const [illView, setIllView] = useState("group"); /* group | list */

  const [illErr, setIllErr] = useState("");
  const fetchIllus = async () => {
    try {
      const { data, error } = await sb.from("illustrations").select("*")
        .order("created_at", { ascending: false });
      if (error) { setIllErr(error.message || "알 수 없는 오류"); return; }
      setIllErr("");
      setIllus((data || []).map((row) => illFrom(row, user.id)));
    } catch (e) {
      setIllErr((e && e.message) || "네트워크 오류");
    }
  };

  const insertIllus = async (recs, onProgress) => {
    const rows = recs.map((r) => illRowFrom(r, "personal", profileName));
    const all = [];
    let failMsg = "";
    for (let i = 0; i < rows.length; i += 3) {
      const part = rows.slice(i, i + 3);
      try {
        const { data, error } = await sb.from("illustrations").insert(part).select();
        if (error) {
          failMsg = error.message || "";
          for (const one of part) {
            const r2 = await sb.from("illustrations").insert([one]).select();
            if (!r2.error && r2.data) all.push(...r2.data);
          }
        } else if (data) all.push(...data);
      } catch (e) { failMsg = (e && e.message) || "네트워크 오류"; }
      if (onProgress) onProgress(Math.min(i + 3, rows.length), rows.length);
    }
    const news = all.map((row) => illFrom(row, user.id));
    if (news.length) setIllus((prev) => [...news, ...prev]);
    if (failMsg) setIllErr(failMsg);
    return { news, failMsg };
  };

  const deleteIllus = async (id) => {
    const { error } = await sb.from("illustrations").delete().eq("id", id);
    if (!error) setIllus((prev) => prev.filter((x) => x.id !== id));
  };

  const illTags = useMemo(() => {
    const s = new Set();
    illus.forEach((x) => (x.tags || []).forEach((t) => s.add(t)));
    return ["전체", ...[...s].sort((a, b) => a.localeCompare(b, "ko"))];
  }, [illus]);

  /* 주제별 묶음 (많이 쓰인 주제부터) */
  const illGroups = useMemo(() => {
    const raw = {};
    illus.forEach((x) => {
      const seen = new Set();
      (x.tags || []).forEach((t) => {
        const n = normTag(t);
        if (!n || seen.has(n)) return;
        seen.add(n);
        raw[n] = (raw[n] || 0) + 1;
      });
    });
    const m = {};

  const insertRecords = async (recs, scope, onProgress) => {
    setSaveState("saving");
    const rows = recs.map((r) => rowFrom(r, scope || r.scope, profileName));
    const all = [];
    let failMsg = "";
    const SIZE = 3;
    for (let i = 0; i < rows.length; i += SIZE) {
      const part = rows.slice(i, i + SIZE);
      let ok = false;
      for (let attempt = 0; attempt < 3 && !ok; attempt++) {
        try {
          const { data, error } = await sb.from("sermons").insert(part).select();
          if (error) {
            failMsg = error.message || "";
            /* 시간 초과면 한 건씩 다시 시도 */
            if (attempt === 0 && part.length > 1) {
              let each = true;
              for (const one of part) {
                const r2 = await sb.from("sermons").insert([one]).select();
                if (r2.error) { each = false; failMsg = r2.error.message || failMsg; }
                else if (r2.data) all.push(...r2.data);
              }
              ok = each;
            }
          } else {
            if (data) all.push(...data);
            ok = true;
          }
        } catch (e) {
          failMsg = (e && e.message) || "네트워크 오류";
        }
        if (!ok) await new Promise((res) => setTimeout(res, 800));
      }
      if (onProgress) onProgress(Math.min(i + SIZE, rows.length), rows.length);
    }
    const news = all.map((row) => recFrom(row, user.id));
    if (news.length) setSermons((prev) => [...news, ...prev]);
    if (news.length < rows.length) {
      setSaveErr((failMsg || "일부 저장 실패") + " — " + news.length + "/" + rows.length + "편만 저장됨");
      setSaveState("error");
    } else {
      setSaveState("idle"); setSaveErr("");
    }
    return news;
  };

  /* 넣은 파일 종류에 따라 알아서 처리: json은 가져오기, 문서는 설교 등록 */
  const handleAddFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (!files.length) return;

    const norm = (x) => { const s = x || ""; return (s.normalize ? s.normalize("NFC") : s).trim(); };
    const baseOf = (x) => norm(x).replace(/\.[^.]+$/, "");

    const jsons = [], links = [], news = [];
    files.forEach((f) => {
      if (/\.json$/i.test(f.name)) { jsons.push(f); return; }
      /* 같은 이름의 설교가 이미 있으면 원문 연결로, 없으면 새 설교로 */
      const hit = sermons.find((s) => s.mine !== false && s.fileName &&
        baseOf(s.fileName) === baseOf(f.name));
      if (hit && !hit.filePath) links.push([f, hit]);

    });

    /* 1) 백업/가져오기 파일 */
    for (const f of jsons) {
      await importData({ target: { files: [f], value: "" } });
    }

    /* 2) 이미 있는 설교의 원문 연결 */
    if (links.length) {
      let ok = 0, failMsg = "";
      for (let i = 0; i < links.length; i++) {
        const [f, rec] = links[i];
        setImportMsg("원문 연결 중… " + (i + 1) + " / " + links.length + "개");
        const fp = await uploadOriginal(f);
        if (!fp) { if (!failMsg) failMsg = "파일 올리기 실패"; continue; }
        try {
          const { error } = await sb.from("sermons").update({ file_path: fp }).eq("id", rec.id);
          if (error) { if (!failMsg) failMsg = error.message || ""; }
          else {
            ok++;
            setSermons((prev) => prev.map((p) => (p.id === rec.id ? { ...p, filePath: fp } : p)));
          }
        } catch (err) { if (!failMsg) failMsg = (err && err.message) || "네트워크 오류"; }
      }
      setImportMsg(
        ok + "개 설교에 원문을 연결했습니다. 카드를 열면 '원문 PDF 보기'가 나타납니다." +
        (failMsg ? " (일부 실패: " + failMsg + ")" : "")
      );
    }

    /* 3) 새 설교 등록 */
    if (news.length) {
      setBatchItems([]);
      setBatchDone(false);
      setView("batch");
      setTimeout(() => runBatch(news), 60);
    } else if (!links.length && !jsons.length) {
      setImportMsg("처리할 파일이 없습니다.");
    }
  };

  const importData = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setImportMsg("");
    try {
      const data = JSON.parse(await file.text());
      const arr = Array.isArray(data) ? data : (data.sermons || []);
      const illArr = (!Array.isArray(data) && Array.isArray(data.illustrations)) ? data.illustrations : [];
      if (!Array.isArray(arr)) throw new Error("bad format");
      if (!arr.length && !illArr.length) throw new Error("bad format");
      const existing = new Set(sermons.map((s) => s.id));
      const cleaned = arr
        .filter((r) => r && r.title)
        .map((r) => ({
          id: !r.id || existing.has(r.id) ? uid() : String(r.id),
          title: String(r.title || ""),
          date: String(r.date || ""),
          book: BOOK_NAMES.includes(r.book) ? r.book : "",
          ref: String(r.ref || ""),
          season: SEASONS.includes(r.season) ? r.season : "일반",
          service: SERVICE_TYPES.includes(r.service) ? r.service : "미지정",
          tags: Array.isArray(r.tags) ? r.tags.map(String) : [],
          fileName: String(r.fileName || ""),
          filePath: String(r.filePath || ""),
          content: String(r.content || ""),
          summary: String(r.summary || ""),
        }));
      if (!cleaned.length) {
        setImportMsg("가져올 기록이 없습니다.");
      } else {
        const dups = cleaned.filter((r) =>
          sermons.some((s) => (s.scope || "personal") === "personal" &&
            (dupKey(s) === dupKey(r) || (r.fileName && s.fileName === r.fileName)))
        );
        let toInsert = cleaned;
        if (dups.length) {
          const skip = window.confirm(
            dups.length + "편이 이미 등록된 설교와 중복됩니다.\n\n확인 = 중복을 제외하고 가져오기\n취소 = 중복 포함 전부 가져오기"
          );
          if (skip) toInsert = cleaned.filter((r) => !dups.includes(r));
        }
        if (!toInsert.length) {
          setImportMsg("모두 중복이어서 새로 가져온 기록이 없습니다.");
        } else {
          setImportMsg("가져오는 중… 0 / " + toInsert.length + "편 (완료될 때까지 이 화면에 머물러 주세요)");
          const news = await insertRecords(toInsert, "personal", (done, total) => {
            setImportMsg("가져오는 중… " + done + " / " + total + "편 (완료될 때까지 이 화면에 머물러 주세요)");
          });
          setImportMsg(
            (news.length === toInsert.length ? "완료 — " : "일부만 완료 — ") +
            news.length + "편을 내 서재로 가져왔습니다." +
            (cleaned.length - toInsert.length > 0 ? " (중복 " + (cleaned.length - toInsert.length) + "편 제외)" : "") +
            (news.length < toInsert.length
              ? " 남은 " + (toInsert.length - news.length) + "편은 같은 파일을 다시 가져오면 이어서 등록됩니다(중복은 자동 제외)."
              : "")
          );
          setLibrary("personal");
        }
      }
      /* 예화 함께 가져오기 */
      if (illArr.length) {
        const seen = new Set(illus.map((x) => (x.title || "").trim() + "|" + (x.body || "").slice(0, 40)));
        const toAdd = illArr
          .filter((r) => r && (r.title || r.body))
          .map((r) => ({
            title: String(r.title || ""), body: String(r.body || ""),
            point: String(r.point || ""), source: String(r.source || ""),
            tags: Array.isArray(r.tags) ? r.tags.map(String) : [],
            usedIn: Array.isArray(r.usedIn) ? r.usedIn : [],
          }))
          .filter((r) => !seen.has((r.title || "").trim() + "|" + (r.body || "").slice(0, 40)));
        if (toAdd.length) {
          setImportMsg((m) => (m ? m + " " : "") + "예화 가져오는 중… 0 / " + toAdd.length);
          const { news, failMsg } = await insertIllus(toAdd, (d, t) =>
            setImportMsg("예화 가져오는 중… " + d + " / " + t));
          if (!news.length) {
            setImportMsg(
              "예화를 저장하지 못했습니다 — 원인: " + (failMsg || "알 수 없는 오류") +
              (/relation|does not exist|schema cache/i.test(failMsg || "")
                ? " → 예화를 담을 표가 아직 없습니다. Supabase의 SQL Editor에서 예화 표 만들기 SQL을 실행한 뒤 다시 가져와 주세요."
                : "")
            );
          } else {
            setImportMsg("완료 — 예화 " + news.length + "편을 가져왔습니다." +
              (illArr.length - toAdd.length > 0 ? " (중복 " + (illArr.length - toAdd.length) + "편 제외)" : "") +
              (failMsg ? " (일부 실패: " + failMsg + ")" : ""));
          }
        } else {
          setImportMsg((m) => (m ? m + " " : "") + "예화는 모두 이미 등록되어 있습니다.");
        }
      }
    } catch (err) {
      setImportMsg("가져오기에 실패했습니다. JSON 형식의 백업/가져오기 파일인지 확인해 주세요.");
    }
    if (e && e.target && typeof e.target.value === "string") e.target.value = "";
  };

  /* 요약·주제어·예배 형태를 한 번에 채웁니다 */
  const runAiAnalyze = async () => {
    setImportMsg("AI 분석을 시작합니다…");
    await autoFillSummary();
    await autoFillTopics();
    await autoAssignServices();
    setImportMsg("AI 분석 완료 — 요약·주제어·예배 형태를 채웠습니다. 기록과 지도에서 확인해 보세요.");
  };

  /* 요약이 비어 있는 기록에 요약 자동 만들기 */
  const autoFillSummary = async () => {
    try {
      const cands = sermons
        .filter((s) => s.mine !== false && !(s.summary || "").trim())
        .map((s) => ({ id: s.id, summary: makeSummary(s) }))
        .filter((x) => x.summary && x.summary.length > 40);
      if (!cands.length) {
        setImportMsg("요약을 만들 설교가 없습니다 (요약이 빈 기록이 없거나 내용이 부족합니다).");
        return;
      }
      let done = 0, failMsg = "";
      const okMap = {};
      for (let i = 0; i < cands.length; i++) {
        const c = cands[i];
        if (i % 5 === 0 || i === cands.length - 1) {
          setImportMsg("요약 만드는 중… " + (i + 1) + " / " + cands.length + "편 — 완료될 때까지 기다려 주세요");
        }
        try {
          const { error } = await sb.from("sermons").update({ summary: c.summary }).eq("id", c.id);
          if (error) { if (!failMsg) failMsg = error.message || ""; }
          else { done++; okMap[c.id] = c.summary; }
        } catch (e) { if (!failMsg) failMsg = (e && e.message) || "네트워크 오류"; }
      }
      setSermons((prev) => prev.map((p) => (okMap[p.id] ? { ...p, summary: okMap[p.id] } : p)));
      setImportMsg(
        (done === cands.length ? "완료 — " : "일부만 완료 — ") + done + "편에 요약을 만들었습니다." +
        (failMsg ? " (실패 원인: " + failMsg + ")" : " 기록에서 확인하고 필요하면 수정해 주세요.")
      );
    } catch (e) {
      setImportMsg("요약 만들기 오류: " + ((e && e.message) || "알 수 없는 오류"));
    }
  };

  /* 태그가 비어 있는 기록에 주제어 자동 채우기 */
  const autoFillTopics = async () => {
    try {
      const cands = sermons
        .filter((s) => s.mine !== false && !(s.tags || []).length)
        .map((s) => ({ id: s.id, tags: guessTopics(s) }))
        .filter((x) => x.tags.length);
      if (!cands.length) {
        setImportMsg("주제어를 채울 설교가 없습니다 (태그가 빈 기록이 없거나 내용이 부족합니다).");
        return;
      }
      let done = 0, failMsg = "";
      const okMap = {};
      for (let i = 0; i < cands.length; i++) {
        const c = cands[i];
        if (i % 5 === 0 || i === cands.length - 1) {
          setImportMsg("주제어 채우는 중… " + (i + 1) + " / " + cands.length + "편 — 완료될 때까지 기다려 주세요");
        }
        try {
          const { error } = await sb.from("sermons").update({ tags: c.tags }).eq("id", c.id);
          if (error) { if (!failMsg) failMsg = error.message || ""; }
          else { done++; okMap[c.id] = c.tags; }
        } catch (e) { if (!failMsg) failMsg = (e && e.message) || "네트워크 오류"; }
      }
      setSermons((prev) => prev.map((p) => (okMap[p.id] ? { ...p, tags: okMap[p.id] } : p)));
      setImportMsg(
        (done === cands.length ? "완료 — " : "일부만 완료 — ") + done + "편에 주제어를 채웠습니다." +
        (failMsg ? " (실패 원인: " + failMsg + ")" : " 주제 지도에서 확인해 보세요.")
      );
    } catch (e) {
      setImportMsg("주제어 채우기 오류: " + ((e && e.message) || "알 수 없는 오류"));
    }
  };

  /* 기존 기록의 파일명·제목으로 예배 형태 일괄 자동 지정 (진행률·오류 표시) */
  const autoAssignServices = async () => {
    try {
      const cands = sermons
        .filter((s) => s.mine !== false && (!s.service || s.service === "미지정"))
        .map((s) => ({
          id: s.id,
          g: guessService((s.fileName || "") + " " + (s.title || ""), (s.content || "").slice(0, 400)),
        }))
        .filter((x) => x.g !== "미지정");
      if (!cands.length) {
        setImportMsg("자동으로 지정할 수 있는 설교가 없습니다 (파일명·제목에 예배 이름이 없는 경우입니다).");
        return;
      }
      let done = 0;
      let failMsg = "";
      const okIds = {};
      for (let i = 0; i < cands.length; i++) {
        const c = cands[i];
        if (i % 5 === 0 || i === cands.length - 1) {
          setImportMsg("예배 형태 자동 지정 중… " + (i + 1) + " / " + cands.length + "편 — 완료될 때까지 이 화면에 머물러 주세요");
        }
        try {
          const { error } = await sb.from("sermons").update({ service: c.g }).eq("id", c.id);
          if (error) { if (!failMsg) failMsg = error.message || "알 수 없는 오류"; }
          else { done++; okIds[c.id] = c.g; }
        } catch (e) {
          if (!failMsg) failMsg = (e && e.message) || "네트워크 오류";
        }
      }
      setSermons((prev) => prev.map((p) => (okIds[p.id] ? { ...p, service: okIds[p.id] } : p)));
      if (done === cands.length) {
        setImportMsg("완료 — " + done + "편의 예배 형태를 자동 지정했습니다. 예배 지도에서 확인해 보세요.");
      } else {
        setImportMsg("일부만 완료 — " + done + "/" + cands.length + "편 지정됨" +
          (failMsg ? " (실패 원인: " + failMsg + ")" : "") +
          ". 버튼을 다시 누르면 남은 것부터 이어서 진행합니다.");
      }
    } catch (e) {
      setImportMsg("자동 지정 중 오류: " + ((e && e.message) || "알 수 없는 오류") + " — 이 문구를 Claude에게 보여주세요.");
    }
  };

  const scriptureLabel = (s) =>
    s.book ? `${s.book}${s.ref ? " " + s.ref : ""}` : "본문 미기록";

  /* 지도 안에서 설교 내용 펼쳐 보기 */
  const mapSermonBody = (s) => (
    <div className="map-sermon">
      {s.summary && <div className="summary"><b>요약</b>{s.summary}</div>}
      {s.filePath && (
        <div className="orig-row">
          <button className="ghost" onClick={async () => {
            if (pdfView && pdfView.id === s.id) { setPdfView(null); return; }
            const { data, error } = await sb.storage.from("sermons").createSignedUrl(s.filePath, 3600);
            if (error || !data) { setSaveErr("원문 주소를 만들지 못했습니다"); setSaveState("error"); return; }
            if (/\.pdf$/i.test(s.filePath)) setPdfView({ id: s.id, url: data.signedUrl });
            else window.open(data.signedUrl, "_blank");
          }}>
            {/\.pdf$/i.test(s.filePath)
              ? (pdfView && pdfView.id === s.id ? "원문 닫기" : "📄 원문 PDF 보기")
              : "원본 파일 내려받기"}
          </button>
          {pdfView && pdfView.id === s.id && (
            <a className="batch-link" href={pdfView.url} target="_blank" rel="noreferrer">새 탭에서 크게 보기</a>
          )}
        </div>
      )}
      {pdfView && pdfView.id === s.id && <iframe className="pdf-frame" src={pdfView.url} title="원문 PDF" />}
      {s.content
        ? <div className="content">{s.content}</div>
        : <p className="muted">저장된 본문 내용이 없습니다.</p>}
      <div style={{ marginTop: 10 }}>
        <button className="ghost" onClick={() => {
          setQuery(""); setFYear("전체"); setFSeason("전체"); setFTag("전체");
          setView("list"); setOpenId(s.id);
        }}>
          기록 화면에서 열기 (수정·삭제)
        </button>
      </div>
    </div>
  );

  /* ── 렌더 ── */
  return (
    <div className="app">
      <style>{CSS}</style>

      <header className="masthead">
        <div className="masthead-inner">
          <div className="brand">
            <button className="shelf-btn" onClick={() => setMenuOpen(!menuOpen)}
              title="작업 메뉴" aria-label="작업 메뉴" aria-expanded={menuOpen}>
              <img src={ICON_IMG} alt="" width="36" height="36" />
            </button>
            <div className="brand-text">
              <h1>설교이음</h1>
              <p className="brand-sub">말씀의 기록과 흐름을 한 곳에</p>
            </div>
            <button className="logout-btn brand-logout" onClick={onLogout} title="로그아웃">로그아웃</button>
          </div>

          {menuOpen && (
            <div className="shelf-menu">
              <button onClick={() => { setMenuOpen(false); startNew(); }}>새로 쓰기</button>
              <button onClick={() => { setMenuOpen(false); const el = document.getElementById("add-file-input"); if (el) el.click(); }}>
                불러오기
              </button>
              <button disabled={!scoped.length} onClick={() => { setMenuOpen(false); exportData(); }}>백업</button>
              <button disabled={!scoped.length}
                onClick={() => { setMenuOpen(false); setSelMode(true); setSelIds(new Set()); setOpenId(null); }}>
                정리
              </button>
              <button onClick={() => { setMenuOpen(false); runAiAnalyze(); }}>AI 분석</button>
            </div>
          )}
          <input id="add-file-input" type="file" multiple
            accept=".hwpx,.hwp,.pdf,.docx,.txt,.json" hidden onChange={handleAddFiles} />
          <nav className="tabs" role="tablist">
            <span className="tab-group">
            <button className={view === "list" ? "on" : ""} onClick={() => setView("list")}>기록</button>
            <button className={view === "map" ? "on" : ""} onClick={() => { setMapBook(null); setView("map"); }}>성경 지도</button>
            <button className={view === "topics" ? "on" : ""} onClick={() => { setTopicSel(null); setView("topics"); }}>주제 지도</button>
            <button className={view === "seasons" ? "on" : ""} onClick={() => { setSeasonSel(null); setView("seasons"); }}>절기</button>
            <button className={view === "services" ? "on" : ""} onClick={() => { setServiceSel(null); setView("services"); }}>예배</button>
            <button className={view === "illus" ? "on" : ""} onClick={() => { setIllOpenId(null); setView("illus"); }}>예화</button>
            {onHome && <button className="home-btn" onClick={onHome} title="대문으로">대문</button>}
            </span>
          </nav>
        </div>
      </header>

      <div className="lib-bar">
        <div className="lib-inner">
          <button className={library === "personal" ? "on" : ""} onClick={() => setLibrary("personal")}>내 서재</button>
          <button className={library === "shared" ? "on" : ""} onClick={() => setLibrary("shared")}>공동 서재</button>
        </div>
      </div>

      {saveState === "error" && (
        <div className="banner error">
          저장에 실패했습니다{saveErr ? " — 원인: " + saveErr : ""}. 이 문구를 Claude에게 보여주시면 해결할 수 있습니다.
        </div>
      )}
      {!loaded && <div className="banner">기록을 불러오는 중…</div>}

      {/* ───────── 기록 목록 ───────── */}
      {loaded && view === "list" && (
        <main className="container">
          <div className="toolbar">
            <input
              className="search"
              placeholder="제목·본문·태그·내용 검색"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
            />
            <div className="filters">
              <select value={searchScope} onChange={(e) => setSearchScope(e.target.value)}>
                <option value="all">검색: 전체 (설교 내용 포함)</option>
                <option value="meta">검색: 제목·본문 말씀만</option>
              </select>
              <select value={fYear} onChange={(e) => setFYear(e.target.value)}>
                {years.map((y) => <option key={y}>{y === "전체" ? "연도: 전체" : y + "년"}</option>)}
              </select>
              <select value={fSeason} onChange={(e) => setFSeason(e.target.value)}>
                <option>전체</option>
                {SEASONS.map((s) => <option key={s}>{s}</option>)}
              </select>
              <select value={fService} onChange={(e) => setFService(e.target.value)}>
                <option value="전체">예배: 전체</option>
                {SERVICE_TYPES.filter((s) => s !== "미지정").map((s) => <option key={s}>{s}</option>)}
                <option value="미지정">미지정</option>
              </select>
              <select value={fTag} onChange={(e) => setFTag(e.target.value)}>
                {allTags.map((t) => <option key={t}>{t === "전체" ? "태그: 전체" : "#" + t}</option>)}
              </select>
              <select value={fState} onChange={(e) => setFState(e.target.value)}>
                <option value="전체">상태: 전체</option>
                <option value="미분석">AI 미분석 (요약 없음)</option>
                <option value="본문미기록">본문 미기록 (말씀 없음)</option>
              </select>
            </div>
          </div>

            <div className="stat"><b>{withBook ? Math.round((otSermons / withBook) * 100) : 0}%</b><span>구약 비중</span></div>
            <div className="stat"><b>{withBook ? Math.round((ntSermons / withBook) * 100) : 0}%</b><span>신약 비중</span></div>
          </div>

          {/* 성경 등뼈: 각 책의 폭 = 장 수 비례 */}
          <div className="spine-wrap">
            <div className="spine-labels"><span>구약</span><span>신약</span></div>
            <div className="spine" role="img" aria-label="성경 전체 설교 분포">
              {BOOKS.map(([name, ch], i) => (
                <button
                  key={name}
                  className={"spine-seg" + (mapBook === name ? " sel" : "") + (i === OT_COUNT ? " nt-start" : "")}
                  style={{ flexGrow: ch, background: heat(bookCounts[name], maxCount) }}
                  title={`${name} · ${bookCounts[name] || 0}편`}
                  onClick={() => setMapBook(mapBook === name ? null : name)}
                />
              ))}
            </div>
            <div className="spine-legend">
              <span>적음</span>
              <span className="legend-cells">
                {[0, 0.25, 0.5, 0.75, 1].map((t) => (
                  <i key={t} style={{ background: t === 0 ? "var(--cell-empty)" : heat(t * maxCount, maxCount) }} />
                ))}
              </span>
              <span>많음</span>
            </div>
          </div>

          {/* 구약·신약 구역, 갈래별 배치 */}
          {BIBLE_SECTIONS.map((sec) => {
            const secTotal = sec.groups.reduce(
              (a, g) => a + g.books.reduce((b, n) => b + (bookCounts[n] || 0), 0), 0);
            return (
              <section key={sec.testament} className="testament">
                <h3 className="testament-head">
                  <span className="testament-name">{sec.testament}</span>
                  <span className="testament-count">{secTotal}편</span>
                </h3>
                <div className="bible-columns">
                  {sec.groups.map((g) => {
                    const gTotal = g.books.reduce((a, n) => a + (bookCounts[n] || 0), 0);
                    return (
                      <div key={g.name} className="bible-col">
                        <div className="bible-group-head">
                          <span className="bible-group-name">{g.name}</span>
                          <span className="bible-group-count">{gTotal}편</span>
                        </div>
                        <div className="book-mini-grid">
                          {g.books.map((name) => (
                            <button key={name}
                              className={"book-cell book-row" + (mapBook === name ? " sel" : "")}
                              style={{ background: heat(bookCounts[name], maxCount) }}
                              onClick={() => setMapBook(mapBook === name ? null : name)}>
                              <span className={"book-name" + ((bookCounts[name] || 0) / maxCount > 0.5 ? " inv" : "")}>
                                {name}
                              </span>
                              <span className={"book-num" + ((bookCounts[name] || 0) / maxCount > 0.5 ? " inv" : "")}>
                                {bookCounts[name] || ""}
                              </span>
                            </button>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </section>
            );
          })}

          {mapBook && (
            <div className="book-detail">
              <h3>{mapBook} <small>{bookCounts[mapBook] || 0}편</small></h3>
              {(bookCounts[mapBook] || 0) === 0 ? (
                <p className="muted">아직 이 성경으로 설교한 기록이 없습니다.</p>
              ) : (
                <ul>
                  {scoped
                    .filter((s) => s.book === mapBook)
                    .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
                    .map((s) => (
                      <li key={s.id}>
                        <button className="link" onClick={() => setMapOpenId(mapOpenId === s.id ? null : s.id)}>
                          <span className="scripture">{scriptureLabel(s)}</span> {s.title}
                          <span className="date"> · {s.date || "날짜 없음"}</span>
                        </button>
                        {mapOpenId === s.id && mapSermonBody(s)}
                      </li>
                    ))}
                </ul>
              )}
            </div>
          )}
        </main>
      )}

      <footer className="foot">기록은 온라인 서버에 저장되어 어느 기기에서나 로그인하면 이어집니다. 안전한 보관을 위해 가끔 '백업 내보내기'도 활용하세요.</footer>
    </div>
  );
}

.book-num.inv{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
@media (max-width:760px){
  .bible-columns{grid-template-columns:1fr;gap:8px}
}
.bible-group{margin-bottom:4px}
.bible-group-head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.bible-group-name{font-size:14px;font-weight:700;color:var(--accent)}
.bible-group-count{font-size:12px;color:var(--muted)}

/* 물방울 유리 단추 */
.book-cell{position:relative;border:none;border-radius:18px;padding:14px 8px;
  text-align:center;cursor:pointer;isolation:isolate;overflow:hidden;
  box-shadow:
    0 -5px 9px rgba(0,0,0,.09) inset,
    0 5px 11px rgba(28,32,40,.15),
    0 1px 2px rgba(28,32,40,.09);
  transition:transform .18s cubic-bezier(.2,.9,.3,1.2), box-shadow .18s ease, filter .18s ease}
/* 위쪽 하이라이트(빛 반사) */
.book-cell::before{content:"";position:absolute;inset:0;height:52%;
  border-radius:inherit;border-bottom-left-radius:60% 100%;border-bottom-right-radius:60% 100%;
  pointer-events:none;z-index:1;
  background:linear-gradient(to bottom, rgba(255,255,255,.55), rgba(255,255,255,.10) 75%, rgba(255,255,255,0))}
/* 아래쪽 굴절광 */
.book-cell::after{content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:1;
  background:radial-gradient(120% 80% at 50% 118%, rgba(255,255,255,.26), rgba(255,255,255,0) 60%)}
.book-cell:hover{transform:translateY(-2px) scale(1.02);
  box-shadow:
    0 -6px 11px rgba(0,0,0,.11) inset,
    0 11px 18px rgba(28,32,40,.20),
    0 2px 4px rgba(28,32,40,.11)}
.book-cell:active{transform:translateY(1px) scale(.98);
  box-shadow:
    0 2px 6px rgba(0,0,0,.22) inset,
    0 1px 2px rgba(28,32,40,.14)}
.book-cell.sel{box-shadow:
    0 0 0 2.5px var(--accent),
    0 -6px 10px rgba(0,0,0,.11) inset,
    0 9px 16px rgba(168,128,47,.26)}
.book-name{position:relative;z-index:2;font-size:12px;color:var(--ink);font-weight:600;
  line-height:1.25;word-break:keep-all;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.book-name.inv{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}

/* 비중 띠도 같은 질감으로 */
.spine{border-radius:14px;overflow:hidden;
  box-shadow:0 1px 1px rgba(255,255,255,.6) inset, 0 -5px 9px rgba(0,0,0,.10) inset,
    0 5px 12px rgba(28,32,40,.14)}
.spine-seg{position:relative;transition:filter .15s ease}
.spine-seg::before{content:"";position:absolute;inset:0 0 55% 0;pointer-events:none;
  background:linear-gradient(to bottom, rgba(255,255,255,.45), rgba(255,255,255,0))}
.spine-seg:hover{filter:brightness(1.08)}
@media (max-width:640px){
  /* 상단 메뉴 — 네 칸 격자로 가지런히 */
  .tabs{gap:6px;flex-direction:column;align-items:stretch}
  .tab-group{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .tabs button{padding:8px 4px!important;font-size:11.5px!important}
  .brand{gap:9px}

  /* 서재 전환 */

  .lib-inner > button{padding:7px 18px!important;font-size:12.5px!important;
    border-radius:15px!important;flex:0 0 auto!important;white-space:nowrap}
  .lib-tools{margin-left:0!important;gap:5px!important;display:flex!important;
    flex:1.6 1 0!important;min-width:0!important}
  .lib-tools .tb-btn{flex:1 1 0!important;min-width:0!important;
    padding:7px 4px!important;font-size:11.5px!important;border-radius:13px!important;
    white-space:nowrap;text-align:center;justify-content:center}
  .lib-tools .tb-label{font-size:11.5px!important}
  .tb-btn{padding:6px 12px!important;font-size:12.5px!important;border-radius:16px!important}
  .tb-btn .tb-label{font-size:12.5px}

  /* 검색 필터 — 두 개씩 나란히 */
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .filters select{width:100%;padding:8px 9px;font-size:12.5px}
  .search{padding:10px 12px;font-size:14px}
  .count-line{font-size:12.5px}

  .tabs{gap:5px}
  .tabs button{padding:6px 11px!important;font-size:12.5px!important;border-radius:15px!important}
  .brand h1{font-size:19px}
  .brand-sub{font-size:11px}
  .lib-inner button{padding:6px 13px!important;font-size:12.5px!important;border-radius:16px!important}
}

@media (prefers-reduced-motion:reduce){
  .book-cell{transition:none}
}

/* 서재 전환 */
.lib-bar{background:#fff;border-bottom:1px solid var(--line)}
.lib-inner{max-width:960px;margin:0 auto;padding:10px 18px;display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}

.lib-inner button{position:relative;isolation:isolate;overflow:hidden;flex:0 0 auto;border:none;
  background:linear-gradient(#f4f6f9,#dfe5ec);color:#5b6675;border-radius:22px;
  padding:9px 24px;font-size:14px;cursor:pointer;
  box-shadow:0 -4px 8px rgba(0,0,0,.09) inset, 0 4px 9px rgba(28,32,40,.16), 0 1px 2px rgba(28,32,40,.10);
  transition:transform .16s cubic-bezier(.2,.9,.3,1.2), box-shadow .16s, filter .16s}

  background:linear-gradient(to bottom, rgba(255,255,255,.8), rgba(255,255,255,.15) 75%, rgba(255,255,255,0))}
.lib-inner button:hover{transform:translateY(-1.5px);filter:brightness(1.03)}

  box-shadow:0 2px 6px rgba(0,0,0,.18) inset}
.lib-inner button.on{background:linear-gradient(#2f4a6e,#152a45);color:#fff;font-weight:700;
  box-shadow:0 -4px 9px rgba(0,0,0,.25) inset, 0 5px 12px rgba(21,42,69,.4), 0 1px 2px rgba(0,0,0,.2)}

/* 첫 화면 (커브드 책장) */
.landing{position:relative;min-height:100vh;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px 86px;background:#efebf7}

  background-position:50% 50%;background-size:cover;background-repeat:no-repeat}

.landing-mark{width:104px;height:104px;display:block;margin:0 auto 26px;border-radius:26px;
  box-shadow:0 18px 38px rgba(70,40,120,.28), 0 2px 6px rgba(70,40,120,.18)}
.landing-eyebrow{display:flex;align-items:center;justify-content:center;gap:16px;

  background:linear-gradient(90deg,rgba(123,106,160,0),rgba(123,106,160,.6))}

/* 계정 */
.logout-btn{background:transparent;border:none;color:#8fa2b8;font-size:12.5px;
  padding:7px 6px;text-decoration:underline;white-space:nowrap}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:30px 28px;width:100%;max-width:400px}
.auth-brand{text-align:center;margin-bottom:18px}
.auth-brand .brand-mark{font-size:30px}
.auth-brand h1{font-family:'Noto Serif KR',serif;font-size:24px;margin:6px 0 4px}
.auth-brand p{font-size:12.5px;color:var(--muted)}
.auth-tabs{display:flex;gap:6px;background:#eef1f5;border-radius:10px;padding:4px;margin-bottom:6px}
.auth-tabs button{flex:1;border:none;background:transparent;padding:9px;border-radius:8px;
  font-size:14px;color:var(--muted)}
.auth-tabs button.on{background:var(--card);color:var(--ink);font-weight:700;
  box-shadow:0 1px 3px rgba(0,0,0,.08)}
.auth-hint{font-size:13px;color:var(--accent);background:var(--accent-soft);
  border-radius:8px;padding:8px 12px;margin-top:10px}
.auth-err{font-size:13px;color:var(--danger);background:#fbe9e6;
  border-radius:8px;padding:8px 12px;margin-top:14px}
.auth-submit{width:100%;margin-top:18px}
.auth-note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:14px;text-align:center}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}

<script>
/* 실행 오류·로드 실패 안내 */
window.__bootErr = "";
window.addEventListener("error", function (e) {
  if (window.__bootErr) return;
  window.__bootErr = (e && e.message) ? e.message : "알 수 없는 오류";
  var boot = document.getElementById("boot");
  if (boot) {
    boot.innerHTML = "앱 실행 중 오류가 발생했습니다:<br/><b style=\'color:#b3402f\'>"
      + window.__bootErr
      + "</b><br/><br/>이 문구를 그대로 Claude에게 보여주시면 해결해 드립니다.";
  }
}, true);
window.addEventListener("load", function () {
  setTimeout(function () {
    var boot = document.getElementById("boot");
    if (boot && !window.__bootErr) {
      boot.innerHTML = "앱을 불러오지 못했습니다. 순서대로 확인해 주세요.<br/><br/>"
        + "1. 크롬(Chrome)이나 엣지(Edge) 같은 최신 브라우저로 열었는지<br/>"
        + "2. 인터넷 연결 상태 확인 후 새로고침(F5)<br/>"
        + "3. 그래도 안 되면 이 화면을 Claude에게 보여주세요";
    }
  }, 8000);
});
</script>
