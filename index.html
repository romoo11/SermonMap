.upload-btn{display:inline-flex;align-items:center;background:var(--ink-deep);color:#fff;
  border-radius:9px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer}
.analyze-btn{background:var(--accent);color:#fff;border:none;border-radius:9px;
  padding:10px 18px;font-size:14px;font-weight:700}
.analyze-btn:disabled{opacity:.4;cursor:not-allowed}
.ai-note{margin-top:10px;font-size:13px;line-height:1.7;background:var(--accent-soft);
  border-radius:8px;padding:8px 12px;color:#6b5320}
.ai-note.err{background:#fbe9e6;color:var(--danger)}
.ai-usage{margin-top:10px;font-size:11.5px;color:var(--muted)}

/* 일괄 등록 */
.batch-link{background:none;border:none;color:var(--accent);font-size:13px;
  font-weight:700;margin-left:12px;padding:0;text-decoration:underline}
.tb-btn{position:relative;display:inline-flex;align-items:center;gap:6px;vertical-align:middle;line-height:1;padding:5px 8px;border-radius:8px}
.tb-btn:hover{background:rgba(24,95,165,.08)}
.tb-btn:focus-visible{outline:2px solid #185FA5;outline-offset:2px}
.tb-btn .tb-label{display:none}
.tb-btn::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;background:#042C53;color:#E6F1FB;font-size:12px;line-height:1.4;padding:5px 10px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:60}
.tb-btn:hover::after,.tb-btn:focus-visible::after{opacity:1}
@media (max-width:820px), (hover:none){
  .tb-btn .tb-label{display:inline}
  .tb-btn::after{display:none}
}
.check-line{display:flex;gap:10px;align-items:flex-start;margin-top:16px;
  font-size:13.5px;line-height:1.7;color:#4a5a6e;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.check-line input{margin-top:4px}
.upload-btn.disabled{opacity:.5;cursor:not-allowed}
.batch-list{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:6px}
.batch-item{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
  background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:10px 14px;font-size:13.5px}
.batch-name{font-weight:500;word-break:break-all}
.batch-status{color:var(--muted);white-space:nowrap;flex-shrink:0;font-size:12.5px}
.batch-item.s-done .batch-status{color:#2e7d4f;font-weight:700}
.batch-item.s-fail .batch-status{color:var(--danger);font-weight:700;white-space:normal}
.batch-item.s-work .batch-status{color:var(--accent)}
.batch-summary{margin-top:20px;text-align:center;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:20px}
.batch-summary p{margin-bottom:12px;font-size:15px}

/* 요약 표시 */
.summary{background:#f2f5f9;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:10px 14px;font-size:14px;line-height:1.75;margin-bottom:12px}
.summary b{display:block;font-size:12px;color:var(--accent);margin-bottom:4px}

/* 폼 */
.field{display:flex;flex-direction:column;gap:6px;margin-top:16px;flex:1}
.field span{font-size:13px;font-weight:700;color:#4a5a6e}
.field input,.field select,.field textarea{padding:11px 12px;font-size:15px;
  border:1px solid var(--line);border-radius:9px;background:var(--card);font-family:inherit}
.field textarea{resize:vertical;line-height:1.7}
.row{display:flex;gap:12px}
.form-actions{display:flex;gap:10px;margin-top:24px}

/* 빈 상태 */
.empty{text-align:center;padding:60px 20px;color:var(--muted);
  font-size:14.5px;line-height:1.9}
.empty-title{font-family:'Noto Serif KR',serif;font-size:19px;
  color:var(--ink);margin-bottom:10px}

/* 성경 지도 */
.map-sub{font-size:14px;color:var(--muted);margin-bottom:18px}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 18px;min-width:110px;flex:1}
.stat b{font-family:'Noto Serif KR',serif;font-size:24px;display:block}
.stat b i{font-style:normal;font-size:15px;color:var(--muted)}
.stat span{font-size:12.5px;color:var(--muted)}

.spine-wrap{margin-bottom:24px}
.spine-labels{display:flex;justify-content:space-between;font-size:12px;
  color:var(--muted);margin-bottom:4px;font-weight:700}
.spine{display:flex;height:44px;border-radius:8px;overflow:hidden;
  border:1px solid var(--line);background:var(--card)}
.spine-seg{flex-basis:0;border:none;padding:0;min-width:2px;transition:opacity .15s}
.spine-seg:hover{opacity:.75}
.spine-seg.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.spine-seg.nt-start{border-left:2px solid var(--accent)}
.spine-legend{display:flex;gap:8px;align-items:center;justify-content:flex-end;
  margin-top:6px;font-size:11.5px;color:var(--muted)}
.legend-cells{display:flex;gap:2px}
.legend-cells i{width:16px;height:10px;border-radius:2px;display:block}

.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:9px;margin-bottom:22px}

/* 구약·신약 구역 */
.testament{margin-bottom:26px;padding:16px 18px 6px;background:var(--card);
  border:1px solid var(--line);border-radius:16px}
.testament-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;
  padding-bottom:9px;border-bottom:2px solid var(--accent)}
.testament-name{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700;color:var(--ink)}
.testament-count{font-size:13px;color:var(--muted)}
.bible-columns{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
.bible-col{min-width:0}
.book-mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
  gap:7px;margin-bottom:16px}
.book-cell.book-row{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:10px 5px;text-align:center;border-radius:14px;min-height:52px}
.book-num{position:relative;z-index:2;font-size:11.5px;font-weight:700;color:var(--accent);
  line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.book-num.inv{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
@media (max-width:760px){
  .bible-columns{grid-template-columns:1fr;gap:8px}
}
.bible-group{margin-bottom:4px}
.bible-group-head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.bible-group-name{font-size:14px;font-weight:700;color:var(--accent)}
.bible-group-count{font-size:12px;color:var(--muted)}

/* 물방울 유리 단추 */
.book-cell{position:relative;border:none;border-radius:18px;padding:14px 8px;
  text-align:center;cursor:pointer;isolation:isolate;overflow:hidden;
  box-shadow:
    0 -5px 9px rgba(0,0,0,.09) inset,
    0 5px 11px rgba(28,32,40,.15),
    0 1px 2px rgba(28,32,40,.09);
  transition:transform .18s cubic-bezier(.2,.9,.3,1.2), box-shadow .18s ease, filter .18s ease}
/* 위쪽 하이라이트(빛 반사) */
.book-cell::before{content:"";position:absolute;inset:0;height:52%;
  border-radius:inherit;border-bottom-left-radius:60% 100%;border-bottom-right-radius:60% 100%;
  pointer-events:none;z-index:1;
  background:linear-gradient(to bottom, rgba(255,255,255,.55), rgba(255,255,255,.10) 75%, rgba(255,255,255,0))}
/* 아래쪽 굴절광 */
.book-cell::after{content:"";position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:1;
  background:radial-gradient(120% 80% at 50% 118%, rgba(255,255,255,.26), rgba(255,255,255,0) 60%)}
.book-cell:hover{transform:translateY(-2px) scale(1.02);
  box-shadow:
    0 -6px 11px rgba(0,0,0,.11) inset,
    0 11px 18px rgba(28,32,40,.20),
    0 2px 4px rgba(28,32,40,.11)}
.book-cell:active{transform:translateY(1px) scale(.98);
  box-shadow:
    0 2px 6px rgba(0,0,0,.22) inset,
    0 1px 2px rgba(28,32,40,.14)}
.book-cell.sel{box-shadow:
    0 0 0 2.5px var(--accent),
    0 -6px 10px rgba(0,0,0,.11) inset,
    0 9px 16px rgba(168,128,47,.26)}
.book-name{position:relative;z-index:2;font-size:12px;color:var(--ink);font-weight:600;
  line-height:1.25;word-break:keep-all;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.book-name.inv{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}

/* 비중 띠도 같은 질감으로 */
.spine{border-radius:14px;overflow:hidden;
  box-shadow:0 1px 1px rgba(255,255,255,.6) inset, 0 -5px 9px rgba(0,0,0,.10) inset,
    0 5px 12px rgba(28,32,40,.14)}
.spine-seg{position:relative;transition:filter .15s ease}
.spine-seg::before{content:"";position:absolute;inset:0 0 55% 0;pointer-events:none;
  background:linear-gradient(to bottom, rgba(255,255,255,.45), rgba(255,255,255,0))}
.spine-seg:hover{filter:brightness(1.08)}
@media (prefers-reduced-motion:reduce){
  .book-cell{transition:none}
}

.book-detail{background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:16px 18px}
.book-detail h3{font-family:'Noto Serif KR',serif;font-size:18px;margin-bottom:8px}
.book-detail h3 small{font-size:13px;color:var(--muted);font-weight:400}
.book-detail ul{list-style:none}
.map-sermon{background:#fbfbf9;border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;margin:4px 0 12px}

.foot{text-align:center;font-size:12px;color:var(--muted);padding:16px}

/* 모바일 */
@media (max-width:560px){
  .row{flex-direction:column;gap:0}
  .card-head{flex-direction:column;gap:6px}
  .card-meta{align-self:flex-start}
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
  .book-name{font-size:10.5px}
  .stat{min-width:calc(50% - 5px)}
}
/* 선택 삭제 · 중복 */
.sel-assign{display:inline-flex;gap:6px;align-items:center}
.sel-assign select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;background:var(--card)}
.sel-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);
  border:1.5px solid var(--danger);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13.5px}
.card-left{display:flex;gap:10px;min-width:0;align-items:flex-start}
.sel-check{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:3px}
.sel-check.on{background:var(--danger);border-color:var(--danger)}
.sel-check.dim{opacity:.25}
.card.selected{border-color:var(--danger)}
.season.dup{background:#fbe9e6;color:#b3402f;font-weight:700}
.season.content-hit{background:#eef1f5;color:#5a6a7d}
.season.noai{background:#f3ead2;color:#8a6d1f}
.season.svc{background:#e2eef2;color:#2f5d6b}
.orig-row{display:flex;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.ill-sections{margin-top:8px;display:flex;flex-direction:column;gap:22px}
.ill-section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.ill-section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;
  padding-bottom:8px;border-bottom:1px solid var(--line)}
.ill-section-name{font-size:16px;font-weight:700;color:var(--ink)}
.ill-section-name::before{content:"#";color:var(--accent);margin-right:2px}
.ill-section-count{font-size:12.5px;color:var(--muted)}
.ill-brief{list-style:none;display:flex;flex-direction:column;gap:9px}
.ill-brief button{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;
  background:none;border:none;cursor:pointer;font-family:inherit;padding:2px 0}
.ill-brief button:hover .ill-brief-title{text-decoration:underline}
.ill-brief-title{font-size:14.5px;font-weight:700;color:var(--ink)}
.ill-brief-point{font-size:13px;color:#5f6b7a;line-height:1.5}
.ill-brief-used{font-size:12px;color:#9aa4b0}
.ill-groups{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.ill-chip{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:6px 13px;font-size:13px;color:#4a5a6e;cursor:pointer;font-family:inherit;
  transition:background .12s,border-color .12s,color .12s}
.ill-chip b{color:var(--accent);font-weight:700;margin-left:3px}
.ill-chip:hover{border-color:var(--accent)}
.ill-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ill-chip.on b{color:#e8c98a}
.ill-head{align-items:flex-start}
.ill-head .card-main{gap:5px}
.ill-point{font-size:13.5px;color:var(--accent);font-weight:600;line-height:1.5}
.ill-peek{font-size:13px;color:#5f6b7a;line-height:1.6;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ill-used{font-size:12.5px;color:#7b8794;line-height:1.5}
.ill-tags{font-size:12px;color:#9aa4b0}
.ill-more{font-size:12px;color:var(--accent);text-decoration:underline;white-space:nowrap}
.used-in{margin-top:12px;padding:10px 14px;background:#f6f4ef;border-radius:10px;font-size:14px}
.used-in b{display:block;margin-bottom:6px;color:var(--accent)}
.used-in ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.row-actions{margin-top:12px;display:flex;gap:8px}
.pdf-frame{width:100%;height:540px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:#fff}

/* 서재 전환 */
.lib-bar{background:#fff;border-bottom:1px solid var(--line)}
.lib-inner{max-width:960px;margin:0 auto;padding:10px 18px;display:flex;gap:8px}
.lib-inner button{flex:0 0 auto;border:1px solid var(--line);background:#eef1f5;
  color:var(--muted);border-radius:20px;padding:7px 20px;font-size:14px}
.lib-inner button.on{background:var(--ink-deep);color:#fff;border-color:var(--ink-deep);font-weight:700}
.season.author{background:#e4ebf3;color:#3c556f}

/* 첫 화면 (커브드 책장) */
.landing{position:relative;min-height:100vh;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px 78px;
  background:#14315f url(${BG_IMG}) repeat;background-size:300px 300px}
.landing::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 70% 55% at 50% 42%, rgba(255,255,255,.10), transparent 65%)}
.landing::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 115% 95% at 50% 50%, transparent 45%, rgba(4,14,34,.62) 100%)}
.landing-inner{position:relative;z-index:2;text-align:center;color:#fff}
.landing-logo{width:min(340px,74vw);height:auto;display:block;margin:0 auto 24px;
  filter:drop-shadow(0 12px 28px rgba(0,0,0,.5))}
.landing-eyebrow{font-size:11.5px;letter-spacing:.52em;color:rgba(255,255,255,.62);margin-bottom:12px}
.landing-inner h1{font-family:'Noto Serif KR',serif;font-size:52px;font-weight:700;color:#fff;
  letter-spacing:.12em;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.landing-sub{margin-top:14px;color:rgba(255,255,255,.78);font-size:15px;letter-spacing:.2em}
.enter-btn{margin-top:40px;background:none;border:none;cursor:pointer;
  color:#fff;font-size:24px;font-weight:900;letter-spacing:.34em;text-indent:.34em;
  padding:8px 6px 12px;text-shadow:0 4px 22px rgba(0,0,0,.6);
  border-bottom:2px solid rgba(255,255,255,.35);transition:color .15s, border-color .15s}
.enter-btn:hover{color:#ffe6a9;border-bottom-color:#ffe6a9}
.admin-panel{position:absolute;top:18px;right:18px;z-index:3;min-width:210px;
  background:rgba(8,18,36,.72);border:1px solid rgba(255,255,255,.18);border-radius:14px;
  backdrop-filter:blur(8px);color:#fff;overflow:hidden}
.admin-toggle{width:100%;background:none;border:none;color:rgba(255,255,255,.9);
  font-size:12.5px;font-weight:700;padding:9px 14px;cursor:pointer;font-family:inherit;letter-spacing:.04em}
.admin-body{padding:4px 14px 12px;font-size:12.5px}
.admin-row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;
  color:rgba(255,255,255,.72)}
.admin-row b{color:#ffe6a9;font-weight:700}
.admin-list{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.16)}
.admin-list b{display:block;margin-bottom:5px;color:rgba(255,255,255,.85);font-size:12px}
.admin-list ul{list-style:none;display:flex;flex-direction:column;gap:3px;max-height:190px;overflow:auto}
.admin-list li{display:flex;justify-content:space-between;gap:10px;color:rgba(255,255,255,.7)}
.admin-list em{font-style:normal;color:#ffe6a9}
.admin-note{position:absolute;top:18px;right:18px;z-index:3;font-size:11px;
  color:rgba(255,255,255,.5);max-width:240px;text-align:right}
@media (max-width:640px){
  .admin-panel{position:static;margin:0 auto 18px;width:min(300px,86vw)}
  .admin-note{position:static;text-align:center;margin-bottom:12px;max-width:none}
}
.landing-foot{position:absolute;left:0;right:0;bottom:22px;z-index:2;text-align:center;
  color:rgba(255,255,255,.45);font-size:11.5px;line-height:1.85;letter-spacing:.02em}
@media (max-width:640px){
  .landing-logo{width:min(250px,78vw);margin-bottom:18px}
  .landing-inner h1{font-size:38px}
  .enter-btn{margin-top:32px;font-size:20px}
  .landing-foot{font-size:10.5px;bottom:16px}
}
/* 계정 */
.logout-btn{background:transparent;border:none;color:#8fa2b8;font-size:12.5px;
  padding:7px 6px;text-decoration:underline;white-space:nowrap}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:30px 28px;width:100%;max-width:400px}
.auth-brand{text-align:center;margin-bottom:18px}
.auth-brand .brand-mark{font-size:30px}
.auth-brand h1{font-family:'Noto Serif KR',serif;font-size:24px;margin:6px 0 4px}
.auth-brand p{font-size:12.5px;color:var(--muted)}
.auth-tabs{display:flex;gap:6px;background:#eef1f5;border-radius:10px;padding:4px;margin-bottom:6px}
.auth-tabs button{flex:1;border:none;background:transparent;padding:9px;border-radius:8px;
  font-size:14px;color:var(--muted)}
.auth-tabs button.on{background:var(--card);color:var(--ink);font-weight:700;
  box-shadow:0 1px 3px rgba(0,0,0,.08)}
.auth-hint{font-size:13px;color:var(--accent);background:var(--accent-soft);
  border-radius:8px;padding:8px 12px;margin-top:10px}
.auth-err{font-size:13px;color:var(--danger);background:#fbe9e6;
  border-radius:8px;padding:8px 12px;margin-top:14px}
.auth-submit{width:100%;margin-top:18px}
.auth-note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:14px;text-align:center}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
`;

<script>
/* 실행 오류·로드 실패 안내 */
window.__bootErr = "";
window.addEventListener("error", function (e) {
  if (window.__bootErr) return;
  window.__bootErr = (e && e.message) ? e.message : "알 수 없는 오류";
  var boot = document.getElementById("boot");
  if (boot) {
    boot.innerHTML = "앱 실행 중 오류가 발생했습니다:<br/><b style=\'color:#b3402f\'>"
      + window.__bootErr
      + "</b><br/><br/>이 문구를 그대로 Claude에게 보여주시면 해결해 드립니다.";
  }
}, true);
window.addEventListener("load", function () {
  setTimeout(function () {
    var boot = document.getElementById("boot");
    if (boot && !window.__bootErr) {
      boot.innerHTML = "앱을 불러오지 못했습니다. 순서대로 확인해 주세요.<br/><br/>"
        + "1. 크롬(Chrome)이나 엣지(Edge) 같은 최신 브라우저로 열었는지<br/>"
        + "2. 인터넷 연결 상태 확인 후 새로고침(F5)<br/>"
        + "3. 그래도 안 되면 이 화면을 Claude에게 보여주세요";
    }
  }, 8000);
});
</script>
